<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Finanzdashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Gegenstück zu public/404.html: den dort in die Query gepackten Pfad
      // wiederherstellen, bevor der Router startet.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          history.replaceState(null, '', document.baseURI.replace(/\/$/, '/') + redirect);
        }
      })();
    </script>
    <div id="root"></div>
    <noscript>Dieses Dashboard benötigt JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
